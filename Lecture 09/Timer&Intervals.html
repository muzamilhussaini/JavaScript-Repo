<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timers and Intervals</title>
    <link rel="shortcut icon" href="time-quarter.webp" type="image/x-icon">
    <link rel="stylesheet" href="Timer&Intervals.css">
</head>
<body>
    <div class="main">
        <h2>Downloading...</h2>
        <div class="container">
            <div class="progress-bar"></div>
        </div>
        <div class="percentage">0%</div>
    </div>

    <!-- Auto-hide alert banner after 3s   -->
    <div class="hide">
        The Display of this div is going to be none after 3s.
    </div>

    <button class="startBtn">Start</button>
    <button  class="stopBtn">Stop</button>
    <script src="Timer&Intervals.js"></script>
</body>
</html>
