<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms And Form Validation</title>
    <link rel="stylesheet" href="form&formValidation.css">
</head>
<body>
    <main>
        <section>
            <form action="">
                <input id="username" type="username" placeholder="Enter your name">
                <div id="hidden">
                    <small class="user">Username is Required</small>
                </div>
                <div id="hide">
                    <small class="characters">Minimum 3 Characters Required</small>
                </div>
                
                <input type="email" placeholder="Enter your Email">
                <input type="password" placeholder="Enter your password">
                <input type="submit">
            </form>
        </section>
    </main>

    <script src="form&formValidation.js"></script>
</body>
</html>
