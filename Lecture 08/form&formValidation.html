<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms And Form Validation</title>
    <link rel="stylesheet" href="form&formValidation.css">
</head>
<body>
    <main>
        <section id="main">
            <h2>Create Account</h2>
            <form action="">
                <!-- Pattern Attribute
                <input pattern="[A-Za-z]{3,}"type="text" placeholder=""> -->
                <input id="username" type="username" placeholder="Enter your name"> 
                <div id="hidden">
                    <small class="user">Username is Required</small>
                </div>
                <div id="hide">
                    <small class="characters">Minimum 3 Characters Required</small>
                </div>
                <input id="email" type="text" placeholder="Enter your Email"> 
                <div class="testEmail">
                    <small>Invalid Email</small>
                </div>
                <input id="password" type="password" placeholder="Enter your password"> 
                <div class="testPassword">
                    <small>Password must contain uppercase, lowercase, number, special character and be at least 8 characters long.</small>
                </div>
                <select name="" id="">
                    <option value="" selected disabled>Choose your gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="others">Others</option>
                </select>
                <div class="selected">
                    <small>Please select your gender</small>
                </div>
                <input type="submit">
            </form>
        </section>
    </main>

    <script src="form&formValidation.js"></script>
</body>
</html>
